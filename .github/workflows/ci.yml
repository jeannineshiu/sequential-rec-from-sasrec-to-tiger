name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint + tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # Both pinned to a moving major tag, and both on node24: GitHub deprecated
      # the node20 runtime that checkout@v4 and setup-uv@v5 target, and was
      # already forcing them onto node24 with a warning on every run.
      # setup-uv stops at v7 deliberately -- v8 dropped major and minor tags in
      # favour of immutable full versions, which without a dependabot config here
      # means a pin that never updates.
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint (ruff)
        run: uv run ruff check src scripts serving tests

      - name: Format check (black)
        run: uv run black --check src scripts serving tests

      # Datasets and trained checkpoints are not in version control, so the
      # tests that need them skip themselves (see tests/test_serving.py). What
      # runs here is the logic that must hold regardless of data: preprocessing
      # invariants, metric definitions, model shapes and masking, semantic-ID
      # construction, and cold-start bucketing.
      - name: Tests
        run: uv run pytest tests/ -q
