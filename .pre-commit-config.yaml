# Versions are kept in step with uv.lock so the hook and CI (.github/workflows/ci.yml)
# never disagree about what "formatted" means.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.22
    hooks:
      - id: ruff
        args: [--fix]
  - repo: https://github.com/psf/black
    rev: 26.5.1
    hooks:
      - id: black
