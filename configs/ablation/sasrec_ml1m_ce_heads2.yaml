# P1b arm 3 of 3: attention head count, on top of the CE objective.
#
# Control is `ablation_ml1m_loss_ce`; `model.num_heads` (1 -> 2, RecBole's
# default) is the only field that differs from
# configs/ablation/sasrec_ml1m_loss_ce.yaml.
#
# hidden_dim stays 50, so 2 heads means 2 x 25 dims per head rather than 1 x 50.
# Parameter count is unchanged -- nn.MultiheadAttention projects to hidden_dim
# either way -- so unlike the width arm this one isolates head count from
# capacity. RecBole runs 2 heads at d=64 (32 per head); combining the two arms is
# not tested here, which is stated with the result.
dataset: ml-1m
data_dir: data/processed/ml-1m

model:
  hidden_dim: 50
  num_blocks: 2
  num_heads: 2
  maxlen: 200
  dropout: 0.2

train:
  batch_size: 128
  lr: 0.001
  adam_beta2: 0.98
  max_epochs: 200
  early_stop_patience: 20
  early_stop_metric: sampled_NDCG@10
  seed: 42
  loss_type: ce

eval:
  k: 10
  sampled_negatives: 100

mlflow:
  experiment: sequential-rec
  run_name: ablation_ml1m_ce_heads2
