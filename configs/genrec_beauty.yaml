# TIGER-style generative recommender on Amazon Beauty.
#
# Model hyperparameters deliberately mirror configs/sasrec_beauty.yaml so the
# Week 6 comparison isolates the item representation (atomic vs semantic ID).
# maxlen is in *items*, as it is for SASRec; the token sequence the model sees
# is maxlen x n_levels = 200 tokens.
dataset: amazon-beauty
data_dir: data/processed/beauty

model:
  hidden_dim: 64
  num_blocks: 2
  num_heads: 1
  maxlen: 50
  dropout: 0.5

train:
  batch_size: 128
  lr: 0.001
  adam_beta2: 0.98
  max_epochs: 200
  early_stop_patience: 20
  early_stop_metric: sampled_NDCG@10
  seed: 42
  # With the history KV cache in place, scoring all 101 candidates for every
  # user costs ~14s, so validation runs on the full valid set exactly as it
  # does for SASRec. Set an integer here to subsample if a slower box needs it.
  valid_subsample: null

eval:
  k: 10
  sampled_negatives: 100
  beam_size: 20

mlflow:
  experiment: sequential-rec
  run_name: genrec_beauty
