# TIGER-style generative recommender on MovieLens-1M.
#
# Model hyperparameters deliberately mirror configs/sasrec_ml1m.yaml so the
# comparison isolates the item representation (atomic vs semantic ID).
# maxlen is in *items*, as it is for SASRec; the token sequence the model sees
# is maxlen x n_levels = 200 x 4 = 800 tokens -- four times Beauty's, which is
# what makes an epoch here ~4 minutes instead of ~38 seconds.
dataset: ml-1m
data_dir: data/processed/ml-1m

model:
  hidden_dim: 50
  num_blocks: 2
  num_heads: 1
  maxlen: 200
  dropout: 0.2

train:
  batch_size: 128
  lr: 0.001
  adam_beta2: 0.98
  max_epochs: 200
  early_stop_patience: 20
  early_stop_metric: sampled_NDCG@10
  seed: 42
  # On Beauty the history KV cache makes a full validation cost ~14s, so that
  # config validates on every user. Here the 800-token sequences push it to
  # ~148s -- more than the training epoch itself -- and ML-1M barely early-stops
  # (SASRec ran 140-200 epochs on it), so a faithful run is ~12h on a laptop.
  # Validating on 2000 of the 6040 users cuts that to ~7h. This only makes the
  # early-stopping signal noisier; the reported test metrics always use every
  # user, so they stay directly comparable to genrec_beauty's.
  valid_subsample: 2000

eval:
  k: 10
  sampled_negatives: 100
  beam_size: 20

mlflow:
  experiment: sequential-rec
  run_name: genrec_ml1m
