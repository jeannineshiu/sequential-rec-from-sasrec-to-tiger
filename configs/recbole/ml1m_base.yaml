# Shared RecBole settings for the BERT4Rec-vs-SASRec training-budget comparison.
# Model-specific overrides (epochs, model name) are passed by src/recbole_run.py.

data_path: 'dataset/'
USER_ID_FIELD: user_id
ITEM_ID_FIELD: item_id
RATING_FIELD: rating
TIME_FIELD: timestamp

load_col:
  inter: [user_id, item_id, rating, timestamp]

# 5-core filtering, same threshold as our own preprocessing (src/data/preprocess.py)
user_inter_num_interval: "[5,inf)"
item_inter_num_interval: "[5,inf)"

# Sequential model settings
# Matches our own SASRec headline maxlen (configs/sasrec_ml1m.yaml). This was
# temporarily dropped to 50 during local Mac (CPU/MPS) smoke testing, where
# RecBole's per-position sequential augmentation on the full ML-1M (dense, avg
# 165 actions/user) with maxlen=200 item-list tensors made dataset/dataloader
# construction extremely slow and, combined with save_dataloaders, produced a
# 6.4GB pickle that nearly filled a 17GB-free disk. Restored to 200 for GPU-box
# runs, which should have more disk/memory headroom and a much faster CUDA path.
MAX_ITEM_LIST_LENGTH: 200
ITEM_LIST_LENGTH_FIELD: item_length
LIST_SUFFIX: _list

# Leave-one-out split, same protocol as our own leave_one_out_split
eval_args:
  split: {'LS': 'valid_and_test'}
  group_by: user
  order: TO
  mode: {'valid': 'uni100', 'test': 'uni100'} # 1 positive + 100 uniform negatives, matches our sampled evaluator

metrics: ["Hit", "NDCG"]
topk: [10]
valid_metric: NDCG@10
valid_metric_bigger: true

# Batch sizes raised from 128/256: on the GPU box, SASRec (a small model) left
# the GPU at only ~20-25% utilization -- it finished each tiny batch and stalled
# waiting for the next one from the dataloader. Bigger batches give the GPU more
# work per step and cut the number of dataloader iterations per epoch, the actual
# bottleneck. GPU memory has huge headroom (was using ~1.4GB of 24GB). Applied
# uniformly so the budget comparison stays consistent.
train_batch_size: 2048
eval_batch_size: 4096

# Parallel dataloading: with worker=0 a single process built every batch and
# starved the GPU. worker>0 spawns DataLoader worker processes to prefetch and
# collate batches in parallel. Kept modest (4) because RecBole does not set
# persistent_workers, so workers are respawned each epoch -- too many would add
# more spawn overhead than they save. Pair with a low per-process CPU-thread cap
# (see daytona_week4.py) so 4 workers don't oversubscribe the 16 cores.
worker: 4
learning_rate: 0.001
learner: adam
# SASRec/BERT4Rec both default to loss_type: CE (full softmax over items,
# no in-batch negative sampling needed during training) -- must be None to match.
train_neg_sample_args: ~

# We control epoch budgets explicitly for the training-budget experiment, so
# disable early stopping (stopping_step >= epochs in every config we'll run).
stopping_step: 100000

# Evaluate every 10 epochs instead of every epoch. Validation is ~16s/epoch, so
# on a 2000-epoch run eval-every-epoch would burn ~9h just evaluating. eval_step
# MUST divide every budget in the sweep (200/800/2000 all divisible by 10) so the
# single max-budget run lands a validation exactly on each budget milestone --
# src/recbole_run.py freezes the best-valid checkpoint at those milestones to
# recover the 1x/4x/10x results from one trajectory.
eval_step: 10

show_progress: false
log_wandb: false

# Cache the 5-core-filtered raw Dataset object (cheap, ~32MB, reused across
# every model/epoch-budget combo). Dataloader caching is left OFF: with
# MAX_ITEM_LIST_LENGTH=200 it produces a multi-gigabyte pickle (the augmented
# per-position sequences x uni100 negative candidate lists for ~1M rows) that
# nearly filled a 17GB-free local disk. If your GPU box has ample disk (say
# 50GB+ free), it's safe to flip save_dataloaders to true and set
# dataloaders_save_path -- it will make the 2nd-6th of the 6 planned runs
# (1x/4x/10x x {SASRec, BERT4Rec}) skip re-building the augmented dataloaders.
save_dataset: true
dataset_save_path: 'saved/ml-1m-dataset.pth'
save_dataloaders: false
