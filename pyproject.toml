[project]
name = "sequential-rec-from-sasrec-to-tiger"
version = "0.1.0"
description = "Sequential recommendation: SASRec reproduction -> BERT4Rec controversy -> TIGER-style generative recommender with semantic IDs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.2",
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.12",
    "tqdm>=4.66",
    "pyyaml>=6.0",
    "mlflow>=2.12",
    "implicit>=0.7.3",
    "matplotlib>=3.11.1",
    "tabulate>=0.10.0",
    "recbole>=1.2.1",
    "py-spy>=0.4.2",
    "sentence-transformers>=5.7.0",
]

[project.optional-dependencies]
daytona = [
    "daytona>=0.200.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "black>=24.0",
    "ruff>=0.4",
    "pre-commit>=3.7",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.hatch.build.targets.wheel]
packages = ["src"]
